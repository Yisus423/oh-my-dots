[window]
# Transparencia (0.0 a 1.0). 0.85 es el punto dulce para Unixporn.
opacity = 0.85
padding = { x = 12, y = 12 }
dynamic_title = true

[font]
# Asegúrate de tener instalada una Nerd Font para que NvChad no se rompa
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
size = 10.0

[colors.primary]
background = '#0a0e14'
foreground = '#b3b1ad'

[colors.normal]
black =   '#131721'
red =     '#ff3333'
green =   '#aad94c'
yellow =  '#e6b450'
blue =    '#59c2ff'
magenta = '#d2a6ff'
cyan =    '#59c2ff'
white =   '#b3b1ad'

[colors.bright]
black =   '#475266'
red =     '#ff6565'
green =   '#eafe44'
yellow =  '#fff779'
blue =    '#68d5ff'
magenta = '#d2a6ff'
cyan =    '#59c2ff'
white =   '#ffffff'

# Selección con el acento principal (gold) — identidad Ayu Gold
[colors.selection]
text = '#0a0e14'
background = '#e6b450'

[cursor]
style = { shape = "Beam", blinking = "On" }
